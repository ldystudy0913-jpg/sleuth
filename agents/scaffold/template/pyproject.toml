[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "__DIST_NAME__"
version = "0.1.0"
description = "Sleuth MCP agent capability package for __AGENT_NAME__."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9", "uvicorn>=0.30", "starlette>=0.37"]
cos = ["boto3"]
all = ["mcp>=1.9", "uvicorn>=0.30", "starlette>=0.37", "boto3"]
# Intranet-only (not in `all`): pip install "log-trace[mysql]>=4.10"
# then SLEUTH_LOG_TRACE=1 and SLEUTH_LOG_TRACE_CONFIG=log_trace.toml
# trace = ["log-trace[mysql]>=4.10"]

[project.scripts]
__PKG_NAME__-mcp = "__PKG_NAME__.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["__PKG_NAME__*"]
