[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "__DIST_NAME__"
version = "0.1.0"
description = "Sleuth MCP agent capability package for __AGENT_NAME__."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
mcp = ["mcp>=1.9", "uvicorn>=0.30", "starlette>=0.37"]
all = ["mcp>=1.9", "uvicorn>=0.30", "starlette>=0.37"]

[project.scripts]
__PKG_NAME__-mcp = "__PKG_NAME__.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["__PKG_NAME__*"]
